# Keeps the OpenWiki docs (openwiki/ directory) in sync with the codebase.
# OpenWiki (https://github.com/langchain-ai/openwiki) is an agent that writes
# and maintains a wiki of markdown docs describing this repo — readable by
# humans and consumable as memory by coding agents.
#
# How it works: on each run, `openwiki code --update` looks at the commits
# that landed since the last run, reads the diffs, and rewrites only the
# affected wiki pages. If nothing changed, the run is a no-op and no PR is
# opened. The very first run (when no openwiki/ directory exists yet)
# generates the full wiki from scratch — trigger it manually from the
# Actions tab via "Run workflow".
#
# Required repository secret: ANTHROPIC_OPENWIKI
# (Settings → Secrets and variables → Actions → New repository secret)

name: OpenWiki Update

on:
  # Manual trigger — use this for the initial wiki generation.
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC; 08:00 UTC is midnight PST.
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # mermaid + jsdom are optional; they add high-fidelity validation of
      # the Mermaid diagrams OpenWiki generates.
      - name: Install OpenWiki
        run: npm install --global openwiki mermaid@11.16.0 jsdom@29.1.1

      # --update also handles the first run (full generation) when the
      # openwiki/ directory doesn't exist yet.
      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_OPENWIKI }}
          OPENWIKI_MODEL_ID: claude-sonnet-5

      # Wiki changes arrive as a reviewable PR (branch openwiki/update)
      # rather than being committed straight to main. Re-runs update the
      # same PR until it's merged.
      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
